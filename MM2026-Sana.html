<script>
'use strict';
const races=JSON.parse(document.getElementById('race-data').textContent);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function overview(){
 document.title='SANAs race · MM 2026';
 app.innerHTML=`<h2 tabindex="-1">Raceoversikt</h2><p class="intro">Velg et race for å se båter, skipper og mannskap. SANAs lag er markert i tabellen.</p><div class="table-wrap" tabindex="0" role="region" aria-label="Raceoversikt, rull sidelengs på små skjermer"><table><caption>Race i kvalifiseringsgruppe 2</caption><thead><tr><th scope="col">Race</th><th scope="col">Kval.grp</th><th scope="col">Flight</th><th scope="col">Heat</th>${Array.from({length:7},(_,i)=>`<th scope="col">Båt ${i+1}</th>`).join('')}</tr></thead><tbody>${races.map(r=>`<tr><th scope="row"><a class="race-link" href="#race-${r.race}" aria-label="Vis båter og mannskap i race ${r.race}">${r.race}</a></th><td>${r.gruppe}</td><td>${r.flight}</td><td>${r.heat}</td>${Array.from({length:7},(_,i)=>{const b=r.boats.find(b=>b.plass===i+1);return b?`<td class="${b.csvLag==='NOR R Liten'?'sana':''}">${esc(b.csvLag)}</td>`:'<td class="empty"><span aria-label="Ingen båt">—</span></td>'}).join('')}</tr>`).join('')}</tbody></table></div><p class="meta" style="margin-top:14px">— betyr ingen båt. Race 7, 11 og 20 har seks deltakende lag.</p>`;
}
function detail(r){
 const index=races.indexOf(r);
 document.title=`Race ${r.race} · SANAs race · MM 2026`;
 app.innerHTML=`<a class="back" href="#oversikt">← Alle race</a><h2 tabindex="-1">Race ${r.race}</h2><p class="meta">Kvalifiseringsgruppe ${r.gruppe} · Flight ${r.flight} · Heat ${r.heat} · ${r.boats.length} båter</p><div class="cards">${r.boats.map(b=>`<article class="card ${b.csvLag==='NOR R Liten'?'sana-card':''}"><div class="tag">Båt ${b.plass}${b.csvLag==='NOR R Liten'?' · SANA':''}</div><h3>${esc(b.csvLag)} <span class="boat-name">· ${esc(b.bat)}</span></h3><p class="skipper"><strong>${esc(b.skipper)}</strong></p><p class="crew">${b.mannskap.length?b.mannskap.map(n=>esc(n)).join('<br>'):'Ikke oppgitt'}</p></article>`).join('')}</div><nav class="nav" aria-label="Andre race">${index>0?`<a href="#race-${races[index-1].race}">← Race ${races[index-1].race}</a>`:'<span></span>'}${index<races.length-1?`<a href="#race-${races[index+1].race}">Race ${races[index+1].race} →</a>`:''}</nav>`;
}
function render(moveFocus=false){
 const m=location.hash.match(/^#race-(\d+)$/);
 const r=m&&races.find(r=>r.race===Number(m[1]));
 if(r)detail(r);else overview();
 if(moveFocus){window.scrollTo(0,0);app.querySelector('h2').focus({preventScroll:true});}
}
window.addEventListener('hashchange',()=>render(true));
render();
</script></body></html>
